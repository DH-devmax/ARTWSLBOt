[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 checksums in the immutable migration manifest"
condition = "AND"
paths = ['''^docs/migrations\.lock\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "Generated source and view SHA-256 hashes; architecture check verifies this manifest"
condition = "AND"
paths = ['''^docs/architecture/generated/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "Two fixed synthetic financial idempotency keys; never credentials"
condition = "AND"
paths = ['''^internal/httpapi/integration_test\.go$''']
regexTarget = "secret"
regexes = ['''^fixture-finance-00[12]$''']

[[rules.allowlists]]
description = "Fixed public historical Docker tag, not a credential"
condition = "AND"
paths = ['''^docs/test-report\.md$''']
regexTarget = "secret"
regexes = ['''^acceptance-observations-20261031$''']

[[rules.allowlists]]
description = "Fixed internal gateway URL path, not an API key"
condition = "AND"
paths = ['''^internal/heatbot/gateway\.go$''']
regexTarget = "secret"
regexes = ['''^8080/internal/v1/ai/generate$''']

[[rules.allowlists]]
description = "Fixed synthetic password in the isolated native-security fixture"
condition = "AND"
paths = ['''^internal/httpapi/native_security_test\.go$''']
regexTarget = "secret"
regexes = ['''^private-new12$''']
