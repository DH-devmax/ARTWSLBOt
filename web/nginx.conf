server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    location ^~ /internal/ { return 404; }
    location ~ "^/api/v1/accounts/[0-9a-f-]+/conversations/[0-9a-f]{64}/media-uploads$" {
        client_max_body_size 18m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/v1/accounts/[0-9a-f-]+/native-security-operations$ {
        client_max_body_size 1500k;
        proxy_request_buffering off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/system/monitor/events {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 105s;
        proxy_send_timeout 10s;
    }
    location ~ ^/api/v1/assistant/turns/[0-9a-f-]+/events$ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 105s;
        proxy_send_timeout 10s;
    }
    location ~ ^/api/v1/accounts/[0-9a-f-]+/events$ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 105s;
        proxy_send_timeout 10s;
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /healthz { proxy_pass http://api:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
