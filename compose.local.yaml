# Explicit local resource overlay; never auto-loaded on production.
# Keep the same project, services, volumes, credentials and readiness gates.
services:
  postgres:
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
  migrate:
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
  bootstrap:
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
  api:
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
  heatbot:
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
  web:
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
