name: Trusted architecture advisory
on:
  workflow_dispatch:
    inputs:
      initialize:
        description: Owner-authorized first paid CodeBoarding baseline and source disclosure
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: trusted-architecture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  model:
    if: >-
      github.repository == 'DH-devmax/ARTWSLBOt' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: architecture-model
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-toolchain
        with:
          native: "false"
      - name: Locked trusted toolchain and source facts
        run: |
          python3 -m pip install --require-hashes -r tools/architecture/requirements.lock
          npm ci --prefix tools/architecture --ignore-scripts --no-audit --no-fund
          python3 tools/check_architecture.py
          python3 tools/architecture/architecture.py check
      - name: Prepare private analysis cache
        run: install -d -m 700 "$HOME/.cache/artwslbot/architecture/analysis"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/artwslbot/architecture/analysis/baseline
            ~/.cache/artwslbot/architecture/analysis/state.json
          key: trusted-architecture-${{ runner.os }}-${{ hashFiles('tools/architecture/requirements.lock', 'tools/architecture/toolchain.json', 'tools/architecture/analyze.py', 'tools/architecture/codeboarding_entry.py', '.codeboarding/.codeboardingignore') }}-${{ github.run_id }}
          restore-keys: |
            trusted-architecture-${{ runner.os }}-${{ hashFiles('tools/architecture/requirements.lock', 'tools/architecture/toolchain.json', 'tools/architecture/analyze.py', 'tools/architecture/codeboarding_entry.py', '.codeboarding/.codeboardingignore') }}-
      - name: Check baseline provenance without model credentials
        if: inputs.initialize != true
        run: python3 tools/architecture/analyze.py --preflight
      - name: Provenance-checked incremental analysis
        env:
          ARCHITECTURE_OPENAI_API_KEY: ${{ secrets.ARCHITECTURE_OPENAI_API_KEY }}
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          command = ["python3", "tools/architecture/analyze.py"]
          if os.environ.get("INITIALIZE") == "true":
              command.append("--initialize")
          subprocess.run(command, check=True)
          PY
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/artwslbot/architecture/analysis/baseline
            ~/.cache/artwslbot/architecture/analysis/state.json
          key: trusted-architecture-${{ runner.os }}-${{ hashFiles('tools/architecture/requirements.lock', 'tools/architecture/toolchain.json', 'tools/architecture/analyze.py', 'tools/architecture/codeboarding_entry.py', '.codeboarding/.codeboardingignore') }}-${{ github.run_id }}
      - name: Safe advisory summary without model transcripts or serialized cache
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path.home() / ".cache/artwslbot/architecture/analysis/last-run.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## CodeBoarding advisory\n\n")
              value = json.loads(path.read_text()) if path.is_file() else {}
              if (value.get("commit") == os.environ["GITHUB_SHA"]
                      and str(value.get("ci_run_id")) == os.environ["GITHUB_RUN_ID"]
                      and str(value.get("ci_run_attempt")) == os.environ["GITHUB_RUN_ATTEMPT"]):
                  summary.write("```json\n" + json.dumps(value, indent=2) + "\n```\n")
              else:
                  summary.write("No completed analysis; inspect the baseline/configuration preflight.\n")
          PY
