name: docker-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and load tested images without registry login or publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    if: github.repository == 'DH-devmax/ARTWSLBOt' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-images-${{ github.sha }}
          path: output/release/images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: foundation-${{ github.sha }}
          path: output/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-report-images-${{ github.sha }}
          path: output/release/receipt
      - name: Check source, aggregate gate, tar hash and configuration ID
        run: python3 tools/ci/release.py --directory output/release
      - name: Load exact verified images without rebuilding
        run: |
          python3 tools/ci/images.py publish --component api --directory output/release/images
          python3 tools/ci/images.py publish --component web --directory output/release/images
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the already tested configurations
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          python3 tools/ci/images.py publish --component api --directory output/release/images --push
          python3 tools/ci/images.py publish --component web --directory output/release/images --push
      - name: Record source, image IDs, archive hashes and immutable registry digests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for component in ("api", "web"):
                  value = json.loads(Path(f"output/release/images/{component}-release.json").read_text())
                  summary.write(f"### {component}\n\n```json\n{json.dumps(value, indent=2)}\n```\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-provenance-${{ github.sha }}
          path: |
            output/release/images/api-release.json
            output/release/images/web-release.json
            output/release/foundation.json
          retention-days: 14
          if-no-files-found: error
