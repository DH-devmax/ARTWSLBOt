name: docker-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    if: github.repository == 'DH-devmax/ARTWSLBOt' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: .
            dockerfile: deploy/api.Dockerfile
          - component: web
            context: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/dh-devmax/artwslbot-${{ matrix.component }}:sha-${{ github.sha }}
      - name: Record immutable image
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "ghcr.io/dh-devmax/artwslbot-${COMPONENT}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
